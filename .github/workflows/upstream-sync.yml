name: Upstream sync

on:
  schedule:
    - cron: '0 22 * * 0'   # 每周日 22:00 UTC = 布里斯班周一早上 8:00
  workflow_dispatch:        # 允许在网页上手动触发

permissions:
  contents: write           # 只需要推分支的权限,不再需要 PR 权限

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream-sync
        uses: actions/checkout@v4
        with:
          ref: upstream-sync
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/qld-gov-au/qgds-bootstrap5-release.git
          git fetch upstream develop

      - name: Merge upstream/develop into upstream-sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge upstream/develop --no-edit

      - name: Push upstream-sync
        run: git push origin upstream-sync